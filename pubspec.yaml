name: flutter_cicd_demo
description: "A production-ready Flutter CI/CD demonstration project with multi-flavor support, secure secrets management, and automated GitHub Actions workflows."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_dotenv: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mockito: ^5.4.4

flutter:
  uses-material-design: true
  assets:
    - .env.dev
    - .env.prod
